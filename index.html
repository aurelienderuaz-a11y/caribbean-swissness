<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caribbean Swissness • 27 Juin 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-[#00332C] text-white">

  <!-- Navigation -->
  <nav class="bg-black/95 sticky top-0 z-50 border-b border-[#00E6C7]/30">
    <div class="max-w-6xl mx-auto px-6 py-5">
      <div class="flex justify-between items-center">
        <img src="https://i.imgur.com/ZKmOdIZ.png" alt="Caribbean Swissness" class="h-14 md:h-16 hidden md:block">
        
        <div class="flex gap-x-7 md:gap-x-10 text-base md:text-lg font-medium">
          <a href="index.html" class="text-[#FFD700] hover:text-amber-300 transition">Accueil</a>
          <a href="formation.html" class="hover:text-[#FFD700] transition">Formation Terahertz</a>
          <a href="association.html" class="hover:text-[#FFD700] transition">Notre Association</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- HERO avec logo agrandi -->
  <section class="min-h-screen bg-gradient-to-br from-[#00332C] via-[#004D40] to-[#00261F] flex items-center justify-center text-center px-6 py-12 md:py-20">
    <div class="max-w-4xl">
      <img src="https://i.imgur.com/ZKmOdIZ.png" 
           alt="Caribbean Swissness" 
           class="mx-auto h-32 md:h-44 lg:h-52 mb-8">

      <div id="countdown" class="flex justify-center gap-6 md:gap-8 mb-10 text-[#FFD700] text-4xl md:text-5xl"></div>
      
      <a href="#billetterie" class="inline-block bg-[#FF4D4D] hover:bg-[#FF6B6B] text-white font-bold text-lg md:text-xl px-10 py-5 rounded-full transition-all">
        JE RÉSERVE MA PLACE
      </a>
    </div>
  </section>

  <!-- DESCRIPTION, GALERIE, TARIFS, etc. (identiques) -->
  <!-- ... (le reste du contenu est conservé) ... -->

  <!-- FOOTER -->
  <footer class="bg-black py-12 text-center">
    <p class="text-xl">Caribbean Swissness 2026 ©</p>
    <p class="text-sm text-gray-500">Restaurant Le Chef - Aéroport de Genève</p>
  </footer>

  <script>
    function countdown() {
      const eventDate = new Date("2026-06-27T19:00:00").getTime();
      const distance = eventDate - Date.now();
      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);
      
      document.getElementById("countdown").innerHTML = `
        <div>${days}<span class="text-xs md:text-sm font-normal block text-[#00E6C7]">JOURS</span></div>
        <div>${hours}<span class="text-xs md:text-sm font-normal block text-[#00E6C7]">HEURES</span></div>
        <div>${minutes}<span class="text-xs md:text-sm font-normal block text-[#00E6C7]">MIN</span></div>
        <div>${seconds}<span class="text-xs md:text-sm font-normal block text-[#00E6C7]">SEC</span></div>
      `;
    }
    setInterval(countdown, 1000);
    countdown();
  </script>
</body>
</html>
